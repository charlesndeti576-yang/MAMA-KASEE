<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAMA POTATOES</title>

<style>
:root{
  --green:#16834b;
  --dark:#10251a;
  --light:#f5f8f5;
  --white:#fff;
  --border:#e3e9e4;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--dark);
  padding-bottom:80px;
}

header{
  background:linear-gradient(135deg,#0d6b3d,#21a45e);
  color:white;
  padding:22px 18px 28px;
  border-radius:0 0 25px 25px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  width:52px;
  height:52px;
  border-radius:14px;
  display:block;
  object-fit:cover;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.cart-btn{
  border:0;
  background:white;
  color:var(--green);
  padding:10px 14px;
  border-radius:12px;
  font-weight:bold;
}

.hero{margin-top:24px}
.hero h1{font-size:32px;margin-bottom:8px}
.hero p{opacity:.9;line-height:1.5}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px 15px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0 15px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:13px;
  outline:none;
  margin-bottom:18px;
  background:white;
  font-size:15px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.product-image{
  height:130px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  background:#edf7ef;
}

.info{padding:13px}
.info h3{font-size:17px;margin-bottom:6px}

.price{
  color:var(--green);
  font-size:18px;
  font-weight:bold;
}

.unit{
  font-size:12px;
  color:#777;
}

.stock{
  display:inline-block;
  margin:8px 0;
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:bold;
}

.available{background:#dcfce7;color:#166534}
.low{background:#fef3c7;color:#92400e}
.out{background:#fee2e2;color:#991b1b}

.add{
  width:100%;
  border:0;
  background:var(--green);
  color:white;
  padding:11px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.add:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav-btn{
  border:0;
  background:none;
  color:#666;
  font-size:12px;
  cursor:pointer;
}

.nav-btn span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-btn.active{
  color:var(--green);
  font-weight:bold;
}

.panel{display:none}
.panel.active{display:block}

.cart-item{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.qty{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:8px;
}

.qty button{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:#e8f3eb;
  color:var(--green);
  font-weight:bold;
}

.total-box{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-top:15px;
  border:1px solid var(--border);
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:bold;
}

.whatsapp{
  width:100%;
  border:0;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  font-size:16px;
  font-weight:bold;
}

.clear{
  width:100%;
  border:1px solid #ddd;
  background:white;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}

.admin-box{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:17px;
  margin-bottom:15px;
}

.admin-box input,
.admin-box select{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #ddd;
  border-radius:10px;
}

.save{
  background:var(--green);
  color:white;
  border:0;
  padding:12px 16px;
  border-radius:10px;
  font-weight:bold;
}

.notice{
  padding:13px;
  background:#fff7df;
  border-radius:12px;
  color:#72520a;
  font-size:13px;
  line-height:1.5;
  margin-bottom:15px;
}

footer{
  text-align:center;
  color:#777;
  font-size:12px;
  padding:25px 0;
}

@media(min-width:700px){
  .products{grid-template-columns:repeat(3,1fr)}
}

    emoji:"🥬",
    price:0,
    unit:"sold per size",
    stock:"Available",
    sizePricing:true
  }
];

let products =
  JSON.parse(localStorage.getItem("mamaPotatoesProductsV2"))
  || defaultProducts;

let cart =
  JSON.parse(localStorage.getItem("mamaPotatoesCartV2"))
  || [];

function saveProducts(){
  localStorage.setItem(
    "mamaPotatoesProductsV2",
    JSON.stringify(products)
  );
}

function saveCart(){
  localStorage.setItem(
    "mamaPotatoesCartV2",
    JSON.stringify(cart)
  );
}

function renderProducts(){

  const container =
    document.getElementById("products");

  const query =
    document.getElementById("search").value.toLowerCase();

  const filtered =
    products.filter(p =>
      p.name.toLowerCase().includes(query)
    );

  container.innerHTML = "";

  filtered.forEach(product => {

    let stockClass = "available";

    if(product.stock === "Low Stock")
      stockClass = "low";

    if(product.stock === "Out of Stock")
      stockClass = "out";

    const disabled =
      product.stock === "Out of Stock"
      ? "disabled"
      : "";

    container.innerHTML += `
      <div class="card">

        <div class="product-image">
          <img src="${product.image}" alt="${product.name}" loading="lazy">
        </div>

        <div class="info">

          <h3>${product.name}</h3>

          <div class="price">
            ${product.sizePricing ? "Sold per size" : "KES " + product.price}
            <span class="unit">${product.sizePricing ? "" : product.unit}</span>
          </div>

          <span class="stock ${stockClass}">
            ${product.stock}
          </span>

          <button
            class="add"
            ${disabled}
            onclick="addToCart(${product.id})">
            ${product.stock === "Out of Stock"
              ? "Out of Stock"
              : product.sizePricing
                ? "Order by Size"
                : "Add to Cart"}
          </button>

        </div>

      </div>
    `;
  });
}

function addToCart(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  let selectedSize = "";

  if(product.sizePricing){
    selectedSize = prompt(
      "Cabbage size: enter Small, Medium or Large"
    );

    if(!selectedSize) return;

    selectedSize = selectedSize.trim();

    const validSizes = ["small","medium","large"];

    if(!validSizes.includes(selectedSize.toLowerCase())){
      alert("Please enter Small, Medium or Large.");
      return;
    }

    selectedSize =
      selectedSize.charAt(0).toUpperCase() +
      selectedSize.slice(1).toLowerCase();
  }

  const existing =
    cart.find(item =>
      item.id === id &&
      item.size === selectedSize
    );

  if(existing){
    existing.quantity++;
  }else{
    cart.push({
      id:id,
      quantity:1,
      size:selectedSize
    });
  }

  saveCart();
  updateCartCount();

  alert(product.name + (selectedSize ? " (" + selectedSize + ")" : "") + " added to cart.");
}

function updateCartCount(){

  const count =
    cart.reduce(
      (sum,item) => sum + item.quantity,
      0
    );

  document.getElementById("cartCount").textContent = count;
}

function renderCart(){

  const container =
    document.getElementById("cartItems");

  container.innerHTML = "";

  let total = 0;

  if(cart.length === 0){

    container.innerHTML = `
      <div class="notice">
        Your cart is empty. Add some fresh produce first.
      </div>
    `;

    document.getElementById("cartTotal").textContent =
      "KES 0";

    return;
  }

  cart.forEach(item => {

    const product =
      products.find(p => p.id === item.id);

    if(!product) return;

    const subtotal =
      product.price * item.quantity;

    if(!product.sizePricing){
      total += subtotal;
    }

    container.innerHTML += `

      <div class="cart-item">

        <div>
          <strong>
            <img
              src="${product.image}"
              alt="${product.name}"
              style="width:34px;height:34px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:6px;"
            >
            ${product.name}${item.size ? " (" + item.size + ")" : ""}
          </strong>

          <div style="margin-top:5px;color:#777">
            ${product.sizePricing ? "Price confirmed by size" : "KES " + product.price + " " + product.unit}
          </div>

          <div class="qty">

            <button onclick="changeQty(${product.id},-1)">
              −
            </button>

            <strong>${item.quantity}</strong>

            <button onclick="changeQty(${product.id},1)">
              +
            </button>

          </div>

        </div>

        <strong>
          ${product.sizePricing ? "Size price" : "KES " + subtotal}
        </strong>

      </div>
    `;
  });

  document.getElementById("cartTotal").textContent =
    "KES " + total;
}

function changeQty(id,change){

  const item =
    cart.find(i => i.id === id);

  if(!item) return;

  item.quantity += change;

  if(item.quantity <= 0){
    cart = cart.filter(i => i.id !== id);
  }

  saveCart();
  updateCartCount();
  renderCart();
}

function clearCart(){

  if(!confirm("Clear your entire cart?"))
    return;

  cart = [];

  saveCart();
  updateCartCount();
  renderCart();
}

function sendWhatsApp(){

  if(cart.length === 0){
    alert("Your cart is empty.");
    return;
  }

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const location =
    document.getElementById("customerLocation").value.trim();

  if(!name || !phone || !location){

    alert(
      "Please enter your name, phone number and delivery location."
    );

    return;
  }

  let message =
    "Hello MAMA POTATOES!%0A%0A";

  message +=
    "I would like to place an order:%0A";

  let total = 0;

  cart.forEach(item => {

    const product =
      products.find(p => p.id === item.id);

    const subtotal =
      product.price * item.quantity;

    total += subtotal;

    message +=
      "- " +
      product.name +
      (item.size ? " (" + item.size + ")" : "") +
      " x " +
      item.quantity +
      (product.sizePricing
        ? " = Price to be confirmed by size"
        : " = KES " + subtotal) +
      "%0A";
  });

  message +=
    "%0ATotal: KES " + total;

  message +=
    "%0A%0ACustomer: " +
    encodeURIComponent(name);

  message +=
    "%0APhone: " +
    encodeURIComponent(phone);

  message +=
    "%0ADelivery location: " +
    encodeURIComponent(location);

  /* MAMA POTATOES WHATSAPP NUMBER */
  const businessNumber = "254720622549";

  const url =
    "https://wa.me/" +
    businessNumber +
    "?text=" +
    message;

  window.open(url,"_blank");
}

function renderAdmin(){

  const container =
    document.getElementById("adminProducts");

  container.innerHTML = "";

  products.forEach(product => {

    container.innerHTML += `

      <div class="admin-box">

        <h3>
          <img
            src="${product.image}"
            alt="${product.name}"
            style="width:38px;height:38px;object-fit:cover;border-radius:9px;vertical-align:middle;margin-right:7px;"
          >
          ${product.name}
        </h3>

        <label>${product.sizePricing ? "Default price (not used for cabbage)" : "Price (KES)"}</label>

        <input
          type="number"
          id="price-${product.id}"
          value="${product.price}"
          ${product.sizePricing ? "disabled" : ""}
        >

        <label>Stock status</label>

        <select id="stock-${product.id}">

          <option ${product.stock==="Available" ? "selected":""}>
            Available
          </option>

          <option ${product.stock==="Low Stock" ? "selected":""}>
            Low Stock
          </option>

          <option ${product.stock==="Out of Stock" ? "selected":""}>
            Out of Stock
          </option>

        </select>

        <button
          class="save"
          onclick="saveProduct(${product.id})">
          Save Changes
        </button>

      </div>
    `;
  });
}

function saveProduct(id){

  const product =
    products.find(p => p.id === id);

  const price =
    Number(
      document.getElementById("price-" + id).value
    );

  const stock =
    document.getElementById("stock-" + id).value;

  product.price = price;
  product.stock = stock;

  saveProducts();

  renderProducts();
  renderCart();
  renderAdmin();

  alert(product.name + " updated successfully.");
}

function showPanel(panel,button){

  document
    .querySelectorAll(".panel")
    .forEach(p =>
      p.classList.remove("active")
    );

  document
    .getElementById(panel)
    .classList.add("active");

  document
    .querySelectorAll(".nav-btn")
    .forEach(b =>
      b.classList.remove("active")
    );

  if(button)
    button.classList.add("active");

  if(panel === "cart")
    renderCart();

  if(panel === "admin")
    renderAdmin();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

renderProducts();
updateCartCount();
renderCart();
renderAdmin();

</script>
